# ─────────────────────────────────────────────────────────────
#  Watch the podcast RSS feed and rebuild the site when a new
#  episode appears.
#
#  Install at:  .github/workflows/rss-watch.yml
#
#  How it works
#  ------------
#  Every run pulls the feed and reads the <guid> of the newest
#  item. That guid is hashed into a cache key. If GitHub already
#  has a cache under that key, we've seen this episode before and
#  we do nothing. If it's a cache miss, the newest episode is one
#  we haven't seen — so we POST the Netlify build hook and save
#  the key so the next run stays quiet.
#
#  Net effect: GitHub polls (free, unlimited on public repos),
#  Netlify only builds when the feed actually changed — roughly
#  once a week instead of hundreds of times a month.
#
#  Requires a repository secret named NETLIFY_BUILD_HOOK holding
#  the Netlify build hook URL.
# ─────────────────────────────────────────────────────────────

name: Watch podcast RSS

on:
  schedule:
    # Episodes land Monday at 10:00 UTC. Check every 10 minutes
    # across a wide window so a DST shift or a late publish still
    # gets caught promptly. Cron here is always UTC.
    - cron: '*/10 9-14 * * 1'
    # Safety net for bonus episodes, re-publishes, or a missed
    # window — every 6 hours, all week.
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: rss-watch
  cancel-in-progress: false

permissions:
  contents: read

env:
  RSS_URL: https://anchor.fm/s/f2a61290/podcast/rss

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read newest episode guid from the feed
        id: feed
        shell: bash
        run: |
          set -euo pipefail

          guid=""
          for attempt in 1 2 3; do
            if curl -sSL --fail --max-time 30 "$RSS_URL" -o feed.xml; then
              # Parsed in Python rather than a grep|head pipeline: the feed
              # has 130+ items, and head closing the pipe early kills grep
              # with EPIPE, which "set -o pipefail" then turns into a job
              # failure. This also skips the channel-level <podcast:guid>,
              # since the regex only matches the bare <guid> tag.
              guid=$(python3 -c "import re;d=open('feed.xml',encoding='utf-8',errors='replace').read();m=re.search(r'<guid[^>]*>(.*?)</guid>',d,re.S);v=m.group(1) if m else '';v=re.sub(r'<!\[CDATA\[(.*?)\]\]>',r'\1',v,flags=re.S);print(v.strip())")
              if [ -n "$guid" ]; then
                break
              fi
            fi
            echo "Attempt $attempt failed; retrying in 15s..."
            sleep 15
          done

          if [ -z "$guid" ]; then
            echo "::error::Could not read a guid from $RSS_URL after 3 attempts."
            exit 1
          fi

          echo "Newest guid: $guid"
          key="rss-$(printf '%s' "$guid" | sha256sum | cut -c1-32)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

          mkdir -p .rss-state
          printf '%s\n' "$guid" > .rss-state/latest

      - name: Have we seen this episode before?
        id: seen
        uses: actions/cache@v4
        with:
          path: .rss-state
          key: ${{ steps.feed.outputs.key }}

      - name: Trigger Netlify build
        if: steps.seen.outputs.cache-hit != 'true'
        shell: bash
        env:
          BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_HOOK:-}" ]; then
            echo "::error::NETLIFY_BUILD_HOOK secret is not set."
            exit 1
          fi
          curl -fsS -X POST -d '{}' "$BUILD_HOOK" > /dev/null
          echo "New episode detected — Netlify build triggered."

      - name: Nothing new
        if: steps.seen.outputs.cache-hit == 'true'
        run: echo "Feed unchanged; no build triggered."
